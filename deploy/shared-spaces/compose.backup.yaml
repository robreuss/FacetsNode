services:
  checkpoint-database:
    image: postgres:17.6-bookworm
    profiles: [operations]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        pg_dump \
          --host=postgres \
          --username=facets_shared_spaces \
          --dbname=facets_shared_spaces \
          --format=custom \
          --file=/checkpoint/database.dump
        sha256sum /checkpoint/database.dump | sed 's#  /checkpoint/#  #' \
          > /checkpoint/database.sha256
    environment:
      PGPASSWORD: ${FACETS_SHARED_SPACES_POSTGRES_PASSWORD:?Set FACETS_SHARED_SPACES_POSTGRES_PASSWORD in deploy/shared-spaces/.env}
    volumes:
      - type: bind
        source: ${FACETS_SHARED_SPACES_CHECKPOINT_DIRECTORY:?Set FACETS_SHARED_SPACES_CHECKPOINT_DIRECTORY}
        target: /checkpoint
    networks:
      - private

  checkpoint-manifest:
    image: postgres:17.6-bookworm
    profiles: [operations]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -s /checkpoint/database.dump
        test -s /checkpoint/database.sha256
        test -z "$(find /blobs/.staging -mindepth 1 -maxdepth 1 -print -quit)"
        cd /blobs
        find . -type f ! -path './.staging/*' -print0 \
          | sort -z \
          | xargs -0 -r sha256sum \
          > /checkpoint/blob-digests.sha256
        blob_count="$(wc -l < /checkpoint/blob-digests.sha256 | tr -d ' ')"
        blob_bytes="$(find . -type f ! -path './.staging/*' -printf '%s\n' \
          | awk '{ total += $1 } END { print total + 0 }')"
        created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        printf '%s\n' \
          '{' \
          '  "formatVersion": 1,' \
          "  \"createdAt\": \"$${created_at}\"," \
          "  \"sourceRevision\": \"$${FACETS_SHARED_SPACES_CHECKPOINT_REVISION}\"," \
          '  "databaseFormat": "postgresql-custom",' \
          "  \"blobCount\": $${blob_count}," \
          "  \"blobByteCount\": $${blob_bytes}" \
          '}' \
          > /checkpoint/manifest.json
        chmod 0600 /checkpoint/*
    environment:
      FACETS_SHARED_SPACES_CHECKPOINT_REVISION: ${FACETS_SHARED_SPACES_CHECKPOINT_REVISION:-unknown}
    volumes:
      - type: bind
        source: ${FACETS_SHARED_SPACES_CHECKPOINT_DIRECTORY:?Set FACETS_SHARED_SPACES_CHECKPOINT_DIRECTORY}
        target: /checkpoint
      - facets-shared-spaces-blobs:/blobs:ro
    network_mode: none

  repository:
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    profiles: [operations]
    environment:
      RESTIC_REPOSITORY: /repository
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
    volumes:
      - type: bind
        source: ${FACETS_SHARED_SPACES_BACKUP_REPOSITORY:?Set FACETS_SHARED_SPACES_BACKUP_REPOSITORY}
        target: /repository
      - type: bind
        source: ${FACETS_SHARED_SPACES_BACKUP_PASSWORD_FILE:?Set FACETS_SHARED_SPACES_BACKUP_PASSWORD_FILE}
        target: /run/secrets/restic-password
        read_only: true
      - type: bind
        source: ${FACETS_SHARED_SPACES_CHECKPOINT_DIRECTORY:?Set FACETS_SHARED_SPACES_CHECKPOINT_DIRECTORY}
        target: /checkpoint
        read_only: true
      - type: bind
        source: ${FACETS_SHARED_SPACES_RESTORE_DIRECTORY:?Set FACETS_SHARED_SPACES_RESTORE_DIRECTORY}
        target: /restore
      - facets-shared-spaces-blobs:/blobs:ro
    network_mode: none

  checkpoint-verify:
    image: postgres:17.6-bookworm
    profiles: [operations]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -s /restore/checkpoint/manifest.json
        grep -q '"formatVersion": 1' /restore/checkpoint/manifest.json
        cd /restore/checkpoint
        sha256sum --check database.sha256
        cd /restore/blobs
        sha256sum --check /restore/checkpoint/blob-digests.sha256
        find . -type f ! -path './.staging/*' -print0 \
          | sort -z \
          | xargs -0 -r sha256sum \
          > /tmp/restored-blob-digests.sha256
        diff -u /restore/checkpoint/blob-digests.sha256 /tmp/restored-blob-digests.sha256
    volumes:
      - type: bind
        source: ${FACETS_SHARED_SPACES_RESTORE_DIRECTORY:?Set FACETS_SHARED_SPACES_RESTORE_DIRECTORY}
        target: /restore
        read_only: true
    network_mode: none

  restore-database:
    image: postgres:17.6-bookworm
    profiles: [operations]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        pg_restore \
          --host=postgres \
          --username=facets_shared_spaces \
          --dbname=facets_shared_spaces \
          --exit-on-error \
          --single-transaction \
          --no-owner \
          --no-privileges \
          /restore/checkpoint/database.dump
    environment:
      PGPASSWORD: ${FACETS_SHARED_SPACES_POSTGRES_PASSWORD:?Set FACETS_SHARED_SPACES_POSTGRES_PASSWORD in deploy/shared-spaces/.env}
    volumes:
      - type: bind
        source: ${FACETS_SHARED_SPACES_RESTORE_DIRECTORY:?Set FACETS_SHARED_SPACES_RESTORE_DIRECTORY}
        target: /restore
        read_only: true
    networks:
      - private

  restore-blobs:
    image: postgres:17.6-bookworm
    profiles: [operations]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -z "$(find /blobs -mindepth 1 -maxdepth 1 -print -quit)"
        cp -a /restore/blobs/. /blobs/
        mkdir -p /blobs/.staging
        runtime_uid="$${FACETS_SHARED_SPACES_RUNTIME_UID}"
        case "$${runtime_uid}" in
          ''|*[!0-9]*) echo "invalid Facets Shared Spaces runtime UID" >&2; exit 1 ;;
        esac
        chown -R "$${runtime_uid}:$${runtime_uid}" /blobs
        chmod 0755 /blobs
        chmod 0700 /blobs/.staging
    environment:
      FACETS_SHARED_SPACES_RUNTIME_UID: ${FACETS_SHARED_SPACES_RUNTIME_UID:-65532}
    volumes:
      - type: bind
        source: ${FACETS_SHARED_SPACES_RESTORE_DIRECTORY:?Set FACETS_SHARED_SPACES_RESTORE_DIRECTORY}
        target: /restore
        read_only: true
      - facets-shared-spaces-blobs:/blobs
    network_mode: none

  temporary-cleanup:
    image: postgres:17.6-bookworm
    profiles: [operations]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        find /checkpoint -mindepth 1 -delete
        find /restore -mindepth 1 -delete
    volumes:
      - type: bind
        source: ${FACETS_SHARED_SPACES_CHECKPOINT_DIRECTORY:?Set FACETS_SHARED_SPACES_CHECKPOINT_DIRECTORY}
        target: /checkpoint
      - type: bind
        source: ${FACETS_SHARED_SPACES_RESTORE_DIRECTORY:?Set FACETS_SHARED_SPACES_RESTORE_DIRECTORY}
        target: /restore
    network_mode: none
