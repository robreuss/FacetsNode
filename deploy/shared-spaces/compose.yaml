name: facets-shared-spaces

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: facets_shared_spaces
      POSTGRES_USER: facets_shared_spaces
      POSTGRES_PASSWORD: ${FACETS_SHARED_SPACES_POSTGRES_PASSWORD:?Set FACETS_SHARED_SPACES_POSTGRES_PASSWORD in deploy/shared-spaces/.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facets_shared_spaces -d facets_shared_spaces"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    volumes:
      - facets-shared-spaces-postgres:/var/lib/postgresql/data
    networks:
      - private

  server:
    build:
      context: ../..
      target: shared-spaces
      args:
        FACETS_SERVER_SOURCE_REVISION: ${FACETS_SERVER_SOURCE_REVISION:-unknown}
        FACETS_SERVER_SOURCE_TREE: ${FACETS_SERVER_SOURCE_TREE:-unknown}
    environment:
      FACETS_SHARED_SPACES_DATABASE_URL: postgres://facets_shared_spaces:${FACETS_SHARED_SPACES_POSTGRES_PASSWORD:?Set FACETS_SHARED_SPACES_POSTGRES_PASSWORD in deploy/shared-spaces/.env}@postgres:5432/facets_shared_spaces?sslmode=disable
      FACETS_SHARED_SPACES_LISTEN_ADDR: :8080
      FACETS_SHARED_SPACES_OPERATOR_TOKEN: ${FACETS_SHARED_SPACES_OPERATOR_TOKEN:?Set FACETS_SHARED_SPACES_OPERATOR_TOKEN in deploy/shared-spaces/.env}
      FACETS_SHARED_SPACES_MANAGED_KEY_ENCRYPTION_KEY: ${FACETS_SHARED_SPACES_MANAGED_KEY_ENCRYPTION_KEY:?Set FACETS_SHARED_SPACES_MANAGED_KEY_ENCRYPTION_KEY in deploy/shared-spaces/.env}
      FACETS_SHARED_SPACES_COMPUTE_CAPABILITY_SIGNING_SEED: ${FACETS_SHARED_SPACES_COMPUTE_CAPABILITY_SIGNING_SEED:?Set FACETS_SHARED_SPACES_COMPUTE_CAPABILITY_SIGNING_SEED in deploy/shared-spaces/.env}
      FACETS_SHARED_SPACES_PUBLIC_URL: ${FACETS_SHARED_SPACES_PUBLIC_URL:?Set FACETS_SHARED_SPACES_PUBLIC_URL in deploy/shared-spaces/.env}
      FACETS_SHARED_SPACES_BLOB_ROOT: /var/lib/facets-shared-spaces/blobs
      FACETS_SHARED_SPACES_BLOB_UPLOAD_TTL: ${FACETS_SHARED_SPACES_BLOB_UPLOAD_TTL:-168h}
      FACETS_SHARED_SPACES_BLOB_ORPHAN_GRACE: ${FACETS_SHARED_SPACES_BLOB_ORPHAN_GRACE:-24h}
      FACETS_SHARED_SPACES_CHECKPOINT_FENCE_TTL: ${FACETS_SHARED_SPACES_CHECKPOINT_FENCE_TTL:-2h}
      FACETS_SHARED_SPACES_HTTP_TRANSFER_PERIOD: ${FACETS_SHARED_SPACES_HTTP_TRANSFER_PERIOD:-10m}
      FACETS_SHARED_SPACES_TRAFFIC_RENDEZVOUS_RATE_PER_MINUTE: ${FACETS_SHARED_SPACES_TRAFFIC_RENDEZVOUS_RATE_PER_MINUTE:-300}
      FACETS_SHARED_SPACES_TRAFFIC_RENDEZVOUS_BURST: ${FACETS_SHARED_SPACES_TRAFFIC_RENDEZVOUS_BURST:-100}
      FACETS_SHARED_SPACES_TRAFFIC_RENDEZVOUS_CONNECTION_RATE_PER_MINUTE: ${FACETS_SHARED_SPACES_TRAFFIC_RENDEZVOUS_CONNECTION_RATE_PER_MINUTE:-2400}
      FACETS_SHARED_SPACES_TRAFFIC_RENDEZVOUS_CONNECTION_BURST: ${FACETS_SHARED_SPACES_TRAFFIC_RENDEZVOUS_CONNECTION_BURST:-400}
      FACETS_SHARED_SPACES_TRAFFIC_RENDEZVOUS_CONCURRENCY: ${FACETS_SHARED_SPACES_TRAFFIC_RENDEZVOUS_CONCURRENCY:-32}
      FACETS_SHARED_SPACES_TRAFFIC_RELAY_MESSAGE_RATE_PER_MINUTE: ${FACETS_SHARED_SPACES_TRAFFIC_RELAY_MESSAGE_RATE_PER_MINUTE:-3000}
      FACETS_SHARED_SPACES_TRAFFIC_RELAY_MESSAGE_BURST: ${FACETS_SHARED_SPACES_TRAFFIC_RELAY_MESSAGE_BURST:-500}
      FACETS_SHARED_SPACES_TRAFFIC_RELAY_MESSAGE_CONNECTION_RATE_PER_MINUTE: ${FACETS_SHARED_SPACES_TRAFFIC_RELAY_MESSAGE_CONNECTION_RATE_PER_MINUTE:-24000}
      FACETS_SHARED_SPACES_TRAFFIC_RELAY_MESSAGE_CONNECTION_BURST: ${FACETS_SHARED_SPACES_TRAFFIC_RELAY_MESSAGE_CONNECTION_BURST:-2000}
      FACETS_SHARED_SPACES_TRAFFIC_RELAY_MESSAGE_CONCURRENCY: ${FACETS_SHARED_SPACES_TRAFFIC_RELAY_MESSAGE_CONCURRENCY:-128}
      FACETS_SHARED_SPACES_TRAFFIC_STORAGE_RATE_PER_MINUTE: ${FACETS_SHARED_SPACES_TRAFFIC_STORAGE_RATE_PER_MINUTE:-1200}
      FACETS_SHARED_SPACES_TRAFFIC_STORAGE_BURST: ${FACETS_SHARED_SPACES_TRAFFIC_STORAGE_BURST:-200}
      FACETS_SHARED_SPACES_TRAFFIC_STORAGE_CONNECTION_RATE_PER_MINUTE: ${FACETS_SHARED_SPACES_TRAFFIC_STORAGE_CONNECTION_RATE_PER_MINUTE:-4800}
      FACETS_SHARED_SPACES_TRAFFIC_STORAGE_CONNECTION_BURST: ${FACETS_SHARED_SPACES_TRAFFIC_STORAGE_CONNECTION_BURST:-800}
      FACETS_SHARED_SPACES_TRAFFIC_STORAGE_CONCURRENCY: ${FACETS_SHARED_SPACES_TRAFFIC_STORAGE_CONCURRENCY:-32}
      FACETS_SHARED_SPACES_TRAFFIC_CHECKPOINT_ADMIN_RATE_PER_MINUTE: ${FACETS_SHARED_SPACES_TRAFFIC_CHECKPOINT_ADMIN_RATE_PER_MINUTE:-600}
      FACETS_SHARED_SPACES_TRAFFIC_CHECKPOINT_ADMIN_BURST: ${FACETS_SHARED_SPACES_TRAFFIC_CHECKPOINT_ADMIN_BURST:-200}
      FACETS_SHARED_SPACES_TRAFFIC_CHECKPOINT_ADMIN_CONNECTION_RATE_PER_MINUTE: ${FACETS_SHARED_SPACES_TRAFFIC_CHECKPOINT_ADMIN_CONNECTION_RATE_PER_MINUTE:-4800}
      FACETS_SHARED_SPACES_TRAFFIC_CHECKPOINT_ADMIN_CONNECTION_BURST: ${FACETS_SHARED_SPACES_TRAFFIC_CHECKPOINT_ADMIN_CONNECTION_BURST:-800}
      FACETS_SHARED_SPACES_TRAFFIC_CHECKPOINT_ADMIN_CONCURRENCY: ${FACETS_SHARED_SPACES_TRAFFIC_CHECKPOINT_ADMIN_CONCURRENCY:-32}
      FACETS_SHARED_SPACES_TRAFFIC_MANAGEMENT_RATE_PER_MINUTE: ${FACETS_SHARED_SPACES_TRAFFIC_MANAGEMENT_RATE_PER_MINUTE:-300}
      FACETS_SHARED_SPACES_TRAFFIC_MANAGEMENT_BURST: ${FACETS_SHARED_SPACES_TRAFFIC_MANAGEMENT_BURST:-100}
      FACETS_SHARED_SPACES_TRAFFIC_MANAGEMENT_CONNECTION_RATE_PER_MINUTE: ${FACETS_SHARED_SPACES_TRAFFIC_MANAGEMENT_CONNECTION_RATE_PER_MINUTE:-600}
      FACETS_SHARED_SPACES_TRAFFIC_MANAGEMENT_CONNECTION_BURST: ${FACETS_SHARED_SPACES_TRAFFIC_MANAGEMENT_CONNECTION_BURST:-200}
      FACETS_SHARED_SPACES_TRAFFIC_MANAGEMENT_CONCURRENCY: ${FACETS_SHARED_SPACES_TRAFFIC_MANAGEMENT_CONCURRENCY:-8}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/facets-shared-spaces-server", "healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - facets-shared-spaces-blobs:/var/lib/facets-shared-spaces/blobs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    ports:
      - 127.0.0.1:${FACETS_SHARED_SPACES_MANAGEMENT_PORT:-8081}:8080
    networks:
      - private
      - edge

  ingress:
    image: caddy:2.10.2-alpine
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config:size=16m,mode=0755
      - /data:size=16m,mode=0755
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FACETS_SHARED_SPACES_TLS_DIRECTORY:-../tls}:/etc/facets-server/tls:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges=true
    ports:
      - ${FACETS_SHARED_SPACES_HTTPS_PORT:-9443}:8443
    networks:
      - edge

networks:
  private:
    internal: true
  edge:

volumes:
  facets-shared-spaces-postgres:
  facets-shared-spaces-blobs:
