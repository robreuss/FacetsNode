name: facets-device-sync

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: facets_device_sync
      POSTGRES_USER: facets_device_sync
      POSTGRES_PASSWORD: ${FACETS_DEVICE_SYNC_POSTGRES_PASSWORD:?Set FACETS_DEVICE_SYNC_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facets_device_sync -d facets_device_sync"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    volumes:
      - facets-device-sync-postgres:/var/lib/postgresql/data
    networks:
      - private

  server:
    build:
      context: .
      target: device-sync
      args:
        FACETS_SERVER_SOURCE_REVISION: ${FACETS_SERVER_SOURCE_REVISION:-unknown}
        FACETS_SERVER_SOURCE_TREE: ${FACETS_SERVER_SOURCE_TREE:-unknown}
    environment:
      FACETS_DEVICE_SYNC_DATABASE_URL: postgres://facets_device_sync:${FACETS_DEVICE_SYNC_POSTGRES_PASSWORD:?Set FACETS_DEVICE_SYNC_POSTGRES_PASSWORD in .env}@postgres:5432/facets_device_sync?sslmode=disable
      FACETS_DEVICE_SYNC_LISTEN_ADDR: :8080
      FACETS_DEVICE_SYNC_OPERATOR_TOKEN: ${FACETS_DEVICE_SYNC_OPERATOR_TOKEN:?Set FACETS_DEVICE_SYNC_OPERATOR_TOKEN in .env}
      FACETS_DEVICE_SYNC_PUBLIC_URL: ${FACETS_DEVICE_SYNC_PUBLIC_URL:?Set FACETS_DEVICE_SYNC_PUBLIC_URL in .env}
      FACETS_DEVICE_SYNC_BLOB_ROOT: /var/lib/facets-device-sync/blobs
      FACETS_DEVICE_SYNC_BLOB_UPLOAD_TTL: ${FACETS_DEVICE_SYNC_BLOB_UPLOAD_TTL:-168h}
      FACETS_DEVICE_SYNC_BLOB_ORPHAN_GRACE: ${FACETS_DEVICE_SYNC_BLOB_ORPHAN_GRACE:-24h}
      FACETS_DEVICE_SYNC_CHECKPOINT_FENCE_TTL: ${FACETS_DEVICE_SYNC_CHECKPOINT_FENCE_TTL:-2h}
      FACETS_DEVICE_SYNC_HTTP_TRANSFER_PERIOD: ${FACETS_DEVICE_SYNC_HTTP_TRANSFER_PERIOD:-10m}
      FACETS_DEVICE_SYNC_TRAFFIC_RENDEZVOUS_RATE_PER_MINUTE: ${FACETS_DEVICE_SYNC_TRAFFIC_RENDEZVOUS_RATE_PER_MINUTE:-300}
      FACETS_DEVICE_SYNC_TRAFFIC_RENDEZVOUS_BURST: ${FACETS_DEVICE_SYNC_TRAFFIC_RENDEZVOUS_BURST:-100}
      FACETS_DEVICE_SYNC_TRAFFIC_RENDEZVOUS_CONNECTION_RATE_PER_MINUTE: ${FACETS_DEVICE_SYNC_TRAFFIC_RENDEZVOUS_CONNECTION_RATE_PER_MINUTE:-2400}
      FACETS_DEVICE_SYNC_TRAFFIC_RENDEZVOUS_CONNECTION_BURST: ${FACETS_DEVICE_SYNC_TRAFFIC_RENDEZVOUS_CONNECTION_BURST:-400}
      FACETS_DEVICE_SYNC_TRAFFIC_RENDEZVOUS_CONCURRENCY: ${FACETS_DEVICE_SYNC_TRAFFIC_RENDEZVOUS_CONCURRENCY:-32}
      FACETS_DEVICE_SYNC_TRAFFIC_RELAY_MESSAGE_RATE_PER_MINUTE: ${FACETS_DEVICE_SYNC_TRAFFIC_RELAY_MESSAGE_RATE_PER_MINUTE:-3000}
      FACETS_DEVICE_SYNC_TRAFFIC_RELAY_MESSAGE_BURST: ${FACETS_DEVICE_SYNC_TRAFFIC_RELAY_MESSAGE_BURST:-500}
      FACETS_DEVICE_SYNC_TRAFFIC_RELAY_MESSAGE_CONNECTION_RATE_PER_MINUTE: ${FACETS_DEVICE_SYNC_TRAFFIC_RELAY_MESSAGE_CONNECTION_RATE_PER_MINUTE:-24000}
      FACETS_DEVICE_SYNC_TRAFFIC_RELAY_MESSAGE_CONNECTION_BURST: ${FACETS_DEVICE_SYNC_TRAFFIC_RELAY_MESSAGE_CONNECTION_BURST:-2000}
      FACETS_DEVICE_SYNC_TRAFFIC_RELAY_MESSAGE_CONCURRENCY: ${FACETS_DEVICE_SYNC_TRAFFIC_RELAY_MESSAGE_CONCURRENCY:-128}
      FACETS_DEVICE_SYNC_TRAFFIC_STORAGE_RATE_PER_MINUTE: ${FACETS_DEVICE_SYNC_TRAFFIC_STORAGE_RATE_PER_MINUTE:-1200}
      FACETS_DEVICE_SYNC_TRAFFIC_STORAGE_BURST: ${FACETS_DEVICE_SYNC_TRAFFIC_STORAGE_BURST:-200}
      FACETS_DEVICE_SYNC_TRAFFIC_STORAGE_CONNECTION_RATE_PER_MINUTE: ${FACETS_DEVICE_SYNC_TRAFFIC_STORAGE_CONNECTION_RATE_PER_MINUTE:-4800}
      FACETS_DEVICE_SYNC_TRAFFIC_STORAGE_CONNECTION_BURST: ${FACETS_DEVICE_SYNC_TRAFFIC_STORAGE_CONNECTION_BURST:-800}
      FACETS_DEVICE_SYNC_TRAFFIC_STORAGE_CONCURRENCY: ${FACETS_DEVICE_SYNC_TRAFFIC_STORAGE_CONCURRENCY:-32}
      FACETS_DEVICE_SYNC_TRAFFIC_CHECKPOINT_ADMIN_RATE_PER_MINUTE: ${FACETS_DEVICE_SYNC_TRAFFIC_CHECKPOINT_ADMIN_RATE_PER_MINUTE:-600}
      FACETS_DEVICE_SYNC_TRAFFIC_CHECKPOINT_ADMIN_BURST: ${FACETS_DEVICE_SYNC_TRAFFIC_CHECKPOINT_ADMIN_BURST:-200}
      FACETS_DEVICE_SYNC_TRAFFIC_CHECKPOINT_ADMIN_CONNECTION_RATE_PER_MINUTE: ${FACETS_DEVICE_SYNC_TRAFFIC_CHECKPOINT_ADMIN_CONNECTION_RATE_PER_MINUTE:-4800}
      FACETS_DEVICE_SYNC_TRAFFIC_CHECKPOINT_ADMIN_CONNECTION_BURST: ${FACETS_DEVICE_SYNC_TRAFFIC_CHECKPOINT_ADMIN_CONNECTION_BURST:-800}
      FACETS_DEVICE_SYNC_TRAFFIC_CHECKPOINT_ADMIN_CONCURRENCY: ${FACETS_DEVICE_SYNC_TRAFFIC_CHECKPOINT_ADMIN_CONCURRENCY:-32}
      FACETS_DEVICE_SYNC_TRAFFIC_MANAGEMENT_RATE_PER_MINUTE: ${FACETS_DEVICE_SYNC_TRAFFIC_MANAGEMENT_RATE_PER_MINUTE:-300}
      FACETS_DEVICE_SYNC_TRAFFIC_MANAGEMENT_BURST: ${FACETS_DEVICE_SYNC_TRAFFIC_MANAGEMENT_BURST:-100}
      FACETS_DEVICE_SYNC_TRAFFIC_MANAGEMENT_CONNECTION_RATE_PER_MINUTE: ${FACETS_DEVICE_SYNC_TRAFFIC_MANAGEMENT_CONNECTION_RATE_PER_MINUTE:-600}
      FACETS_DEVICE_SYNC_TRAFFIC_MANAGEMENT_CONNECTION_BURST: ${FACETS_DEVICE_SYNC_TRAFFIC_MANAGEMENT_CONNECTION_BURST:-200}
      FACETS_DEVICE_SYNC_TRAFFIC_MANAGEMENT_CONCURRENCY: ${FACETS_DEVICE_SYNC_TRAFFIC_MANAGEMENT_CONCURRENCY:-8}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/facets-device-sync-server", "healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - facets-device-sync-blobs:/var/lib/facets-device-sync/blobs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges=true
    ports:
      - 127.0.0.1:${FACETS_DEVICE_SYNC_MANAGEMENT_PORT:-8080}:8080
    networks:
      - private
      - edge

  ingress:
    image: caddy:2.10.2-alpine
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /config:size=16m,mode=0755
      - /data:size=16m,mode=0755
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/tls:/etc/facets-server/tls:ro
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges=true
    ports:
      - ${FACETS_DEVICE_SYNC_HTTPS_PORT:-8443}:8443
    networks:
      - edge

networks:
  private:
    internal: true
  edge:

volumes:
  facets-device-sync-postgres:
  facets-device-sync-blobs:
