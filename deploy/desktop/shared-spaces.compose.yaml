# Independent project, databases, credentials and named volumes stay independent.
services:
  postgres:
    image: ${FBD_POSTGRES_IMAGE:?verified local image required}
    pull_policy: never
    restart: "no"
  server:
    image: ${FBD_SHARED_SPACES_IMAGE:?verified local image required}
    build: !reset null
    pull_policy: never
    restart: "no"
    ports: !reset []
    environment:
      FACETS_SHARED_SPACES_CANDIDATE_MAINTENANCE: ${FBD_CANDIDATE_MAINTENANCE:?explicit serving mode required}
      FACETS_SHARED_SPACES_DEPLOYMENT_ID: ${FACETS_SHARED_SPACES_DEPLOYMENT_ID:?}
      FACETS_SHARED_SPACES_DEPLOYMENT_SIGNING_KEY_FILE: /run/secrets/facets-shared-spaces/deployment-signing-key
      FACETS_SHARED_SPACES_DEPLOYMENT_ROUTE_POLICY_FILE: /etc/facets-shared-spaces/service-authority/deployment-routes.json
      FACETS_SHARED_SPACES_SERVICE_AUTHORITY_BINDINGS_FILE: /var/lib/facets-shared-spaces/service-authority/bindings.json
    volumes:
      - ${FACETS_SHARED_SPACES_AUTHORITY_KEY_DIRECTORY:?}:/run/secrets/facets-shared-spaces:ro
      - ${FACETS_SHARED_SPACES_AUTHORITY_POLICY_DIRECTORY:?}:/etc/facets-shared-spaces/service-authority:ro
      - ${FACETS_SHARED_SPACES_AUTHORITY_STATE_DIRECTORY:?}:/var/lib/facets-shared-spaces/service-authority
  ingress:
    profiles: [desktop-disabled]
    restart: "no"
    ports: !reset []
  onion-ingress:
    image: ${FBD_CADDY_IMAGE:?verified local image required}
    pull_policy: never
    restart: "no"
    volumes: !override
      - ${FBD_RECIPE_DIRECTORY:?}/Group.Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FACETS_SHARED_SPACES_TLS_DIRECTORY:?}:/etc/facets-server/tls:ro
      - facets-shared-spaces-onion-socket:/run/facets-onion
      - ${FBD_ADMIN_SOCKET_DIRECTORY:?}:/run/facets-admin
  tor:
    image: ${FBD_TOR_IMAGE:?verified local image required}
    build: !reset null
    pull_policy: never
    restart: "no"
